# Pocket: keys only. Named 00- so it sorts before cloud-init's 50-cloud-init.conf (sshd keeps the first value it reads).
# Stage 10 installs this before sshd can start and enables sshd only when the account has an authorized key.
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
PermitRootLogin no
X11Forwarding no
