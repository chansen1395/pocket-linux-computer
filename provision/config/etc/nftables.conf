#!/usr/sbin/nft -f
# Pocket firewall. Installed by provision/stages/30-network.sh, loaded by nftables.service.
#
# Jobs: (1) nothing listens to the public internet; (2) every DNS query from every process and
# every hotspot client lands on the local filtering resolver, and known bypasses (DoT, DoH to
# public resolvers) are dropped; (3) hotspot clients may forward out.
#
# AP_IF is the hotspot interface NetworkManager creates in shared mode (see stage 30).

define AP_IF = "ap0"
define RESOLVER_USER = "blocky"
define PUBLIC_RESOLVERS_V4 = {
  8.8.8.8, 8.8.4.4,                      # Google
  1.1.1.1, 1.0.0.1,                      # Cloudflare
  9.9.9.9, 149.112.112.112,              # Quad9
  208.67.222.222, 208.67.220.220,        # OpenDNS
  94.140.14.14, 94.140.15.15,            # AdGuard
  76.76.2.0, 76.76.10.0                  # ControlD
}

flush ruleset

table inet pocket {
  chain input {
    type filter hook input priority filter; policy drop;
    ct state established,related accept
    iif "lo" accept
    ct state invalid drop
    meta l4proto { icmp, ipv6-icmp } accept
    iifname $AP_IF udp dport { 53, 67 } accept comment "hotspot clients: dns, dhcp"
    iifname $AP_IF tcp dport 53 accept
    tcp dport 22 accept comment "ssh, every interface; key-only (sshd_config.d/00-pocket.conf), enabled by stage 10 only with an authorized key"
    udp dport 60000-61000 accept comment "mosh"
  }

  chain forward {
    type filter hook forward priority filter; policy drop;
    ct state established,related accept
    iifname $AP_IF accept comment "hotspot clients out (NetworkManager shared mode does the NAT)"
  }

  chain output {
    type filter hook output priority filter; policy accept;
    # DNS-over-TLS and DoH to public resolvers are only for the resolver itself.
    meta skuid != $RESOLVER_USER tcp dport 853 drop
    meta skuid != $RESOLVER_USER ip daddr $PUBLIC_RESOLVERS_V4 tcp dport 443 drop
    meta skuid != $RESOLVER_USER ip daddr $PUBLIC_RESOLVERS_V4 udp dport 443 drop
  }
}

table ip pocket_nat {
  chain output {
    type nat hook output priority dstnat; policy accept;
    # Any process that hard-codes a resolver gets ours instead.
    meta skuid != $RESOLVER_USER ip daddr != 127.0.0.1 udp dport 53 redirect to :53
    meta skuid != $RESOLVER_USER ip daddr != 127.0.0.1 tcp dport 53 redirect to :53
  }
  chain prerouting {
    type nat hook prerouting priority dstnat; policy accept;
    # Hotspot clients likewise; the AP address runs NetworkManager's dnsmasq, which forwards to us.
    iifname $AP_IF udp dport 53 redirect to :53
    iifname $AP_IF tcp dport 53 redirect to :53
  }
}

table ip6 pocket_nat6 {
  chain output {
    type nat hook output priority dstnat; policy accept;
    meta skuid != $RESOLVER_USER ip6 daddr != ::1 udp dport 53 redirect to :53
    meta skuid != $RESOLVER_USER ip6 daddr != ::1 tcp dport 53 redirect to :53
  }
}
