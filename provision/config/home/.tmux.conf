# Pocket tmux: big touch-friendly status, mouse on, sane prefix.
set -g mouse on
set -g history-limit 20000
set -g status-interval 5
set -g status-style 'bg=#1a3a1a fg=#9cff9c'
set -g status-left ' #S '
set -g status-right ' #(cat /sys/class/thermal/thermal_zone0/temp 2>/dev/null | cut -c1-2)C  %H:%M '
set -g default-terminal 'tmux-256color'
set -g escape-time 10
setw -g mode-keys vi
