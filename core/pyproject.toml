[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pocket-core"
version = "0.1.0"
description = "Device core for a Raspberry Pi 5 pocket computer: one backend behind the pocketctl CLI, the pocket-mcp server and the Pocket TUI"
readme = "README.md"
license = "MIT"
authors = [{ name = "Connor Hansen" }]
requires-python = ">=3.11"
dependencies = ["mcp>=2.3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pocketctl = "pocket_core.cli:main"
pocket-mcp = "pocket_core.mcp_server:main"

[tool.setuptools.packages.find]
include = ["pocket_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
